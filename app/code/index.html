<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>treat | Hub & Changelog</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293e',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkbg text-slate-100 min-h-screen font-sans antialiased selection:bg-dark-500 selection:text-white">

    <!-- Header / Hero Section -->
    <header class="max-w-4xl mx-auto px-6 pt-16 pb-10 text-center">
        
        <!-- Updated Image Icon -->
        <div class="flex justify-center mb-4">
            <img 
                src="https://raw.githubusercontent.com/treatwashere/assets/main/Screenshot_20260109-155441-049.png" 
                alt="treat logo" 
                class="w-24 h-24 rounded-full border-2 border-indigo-500/30 shadow-lg object-cover"
            >
        </div>

        <h1 class="text-4xl font-extrabold tracking-tight sm:text-5xl">treat</h1>
        <p class="mt-3 text-slate-400 text-lg max-w-xl mx-auto">Welcome to my central hub. Track my latest projects, repository updates, changelogs, and video content all in one place.</p>
        
        <!-- Quick Social / Links -->
        <div class="mt-6 flex justify-center gap-4">
            <a href="https://github.com/treatwashere" target="_blank" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-sm font-medium transition flex items-center gap-2">
                <i class="fa-brands fa-github"></i> GitHub
            </a>
            
            <!-- Updated Channel Link -->
            <a href="https://youtube.com/@treatYTT" target="_blank" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-sm font-medium transition flex items-center gap-2 text-rose-400">
                <i class="fa-brands fa-youtube"></i> Channel
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 space-y-12 pb-20">

        <!-- Live Repositories Section -->
        <section>
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-code-fork text-indigo-400"></i> Public Repositories
                </h2>
                <span class="text-xs text-slate-400">Auto-fetched from GitHub</span>
            </div>
            
            <!-- Repo Grid Container -->
            <div id="repos-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Loading State -->
                <div class="col-span-2 text-center py-8 text-slate-500">
                    <i class="fa-solid fa-spinner fa-spin mr-2"></i> Loading repositories...
                </div>
            </div>
        </section>

    <!-- Footer -->
    <footer class="border-t border-slate-800 text-center py-6 text-slate-500 text-sm">
        <p>&copy; <span id="year"></span> treat. Built with GitHub Pages & Tailwind CSS.</p>
    </footer>

    <!-- JavaScript to Fetch GitHub Repos -->
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        async function fetchRepos() {
            const container = document.getElementById('repos-container');
            try {
                // Fetching up to 100 repositories to ensure all are shown
                const response = await fetch('https://api.github.com/users/treatwashere/repos?sort=updated&per_page=100');
                if (!response.ok) throw new Error('Failed to fetch repositories');
                
                const repos = await response.json();
                
                // Keep all repos, or optionally filter out the profile repo itself
                const filteredRepos = repos.filter(repo => repo.name.toLowerCase() !== 'treatwashere.github.io');

                if (filteredRepos.length === 0) {
                    container.innerHTML = '<p class="text-slate-500 col-span-2">No other public repositories found yet.</p>';
                    return;
                }

                container.innerHTML = filteredRepos.map(repo => `
                    <a href="${repo.html_url}" target="_blank" class="bg-cardbg border border-slate-800 hover:border-indigo-500/50 p-5 rounded-xl transition group flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between mb-2">
                                <h3 class="font-bold group-hover:text-indigo-400 transition flex items-center gap-2 break-all">
                                    <i class="fa-regular fa-folder text-slate-500"></i> ${repo.name}
                                </h3>
                                ${repo.language ? `<span class="text-xs px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700 whitespace-nowrap ml-2">${repo.language}</span>` : ''}
                            </div>
                            <p class="text-slate-400 text-sm line-clamp-2 mb-4">${repo.description || 'No description provided.'}</p>
                        </div>
                        <div class="flex items-center justify-between text-xs text-slate-500 pt-3 border-t border-slate-800/60">
                            <span><i class="fa-solid fa-star text-amber-400 mr-1"></i> ${repo.stargazers_count}</span>
                            <span>Updated ${new Date(repo.updated_at).toLocaleDateString()}</span>
                        </div>
                    </a>
                `).join('');

            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="col-span-2 text-center text-rose-400 py-4">Could not load repositories at this time.</div>';
            }
        }

        fetchRepos();
    </script>
</body>
</html>
